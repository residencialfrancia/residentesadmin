<!-- [Descripción: Estructura HTML completa del Perfil de Residentes. Incluye diseño minimalista, el intercambio dinámico de la fila de nombres (Lectura: 1 caja vs Edición: 4 cajas), los campos de Apodo y Género, la división 50/50 para Médicos y Obras Sociales, y el contenedor de Documentación con la barra lateral.] -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil de Residente - Residencial Francia</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Fuentes e Iconos -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">

    <main class="profile-container">
        
        <!-- BARRA SUPERIOR INTEGRADA (Botón Volver + Pestañas + Badge) -->
        <div class="profile-top-bar">
            <a href="index.html" class="btn-back-sleek" title="Volver al Inicio">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            
            <div class="profile-tabs-group">
                <button type="button" id="btnTabPerfil" class="profile-tab active" onclick="switchProfileTab('perfil')">Información del Perfil</button>
                <button type="button" id="btnTabDocs" class="profile-tab" onclick="switchProfileTab('docs')">Documentación</button>
            </div>
            
            <span id="statusBadge" class="status-badge hidden">ARCHIVADO</span>
        </div>

        <div id="toast" class="toast"></div>

        <!-- SPINNER DE CARGA -->
        <div id="loader" class="loader-container hidden">
            <div class="spinner"></div>
            <p>Procesando datos...</p>
        </div>

        <!-- CONTENEDOR PRINCIPAL DEL PERFIL -->
        <div id="residentForm" class="profile-form readonly-mode">

            <!-- ======================================================= -->
            <!-- PESTAÑA: INFO PERFIL (Fondo azul principal)             -->
            <!-- ======================================================= -->
            <div id="tab-perfil" class="tab-content-wrapper">
                
                <!-- SECCIÓN 1: DATOS PERSONALES -->
                <section class="profile-section section-1">
                    <div class="top-info-wrapper" style="display: flex; gap: 2rem; width: 100%; align-items: flex-start; flex-wrap: wrap;">
                        
                        <!-- Columna Izquierda: FOTO Y BOTONES DE ACCIÓN -->
                        <div class="photo-column" style="display: flex; flex-direction: column; gap: 12px; align-items: center; width: 220px; flex-shrink: 0;">
                            <div class="photo-wrapper" style="margin-bottom: 5px; width: 100%; display: flex; justify-content: center;">
                                <img id="profileImage" src="" alt="Foto Residente" onerror="this.src='https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_1280.png'" style="max-width: 100%; height: auto; border-radius: 8px;">
                            </div>
                            <label id="btnUploadContainer" for="imageUpload" class="btn btn-outline hidden" style="width: 100%; justify-content: center; cursor: pointer;">
                                <i class="fa-solid fa-upload"></i> Cargar Imagen
                            </label>
                            <input type="file" id="imageUpload" accept="image/*" style="display: none;">

                            <button id="btnEditPerfil" class="btn btn-primary" style="width: 100%; justify-content: center;">
                                <i class="fa-solid fa-pen"></i> Editar Info
                            </button>
                            <button id="btnSavePerfil" class="btn btn-success hidden" style="width: 100%; justify-content: center;">
                                <i class="fa-solid fa-save"></i> Guardar
                            </button>
                            <button id="btnCancelPerfil" class="btn btn-danger hidden" style="width: 100%; justify-content: center;">
                                <i class="fa-solid fa-xmark"></i> Cancelar
                            </button>
                            <button id="btnRestore" class="btn btn-warning hidden" style="width: 100%; justify-content: center; background-color: #f39c12; color: white; border: none; font-weight: bold; margin-top: 10px;">
                                <i class="fa-solid fa-box-open"></i> Restaurar
                            </button>
                            
                            <div class="form-group hidden" id="divFechaSalida" style="width: 100%; margin-top: 10px;">
                                <label style="color: var(--danger); text-align: center; width: 100%; display: block;">Fecha de Salida</label>
                                <input type="date" id="fechaSalida" name="fechaSalida" class="warning-text" readonly style="text-align: center;">
                            </div>
                        </div>
                        
                        <!-- Columna Derecha: FORMULARIO DE DATOS -->
                        <div class="info-column" style="flex: 1; display: flex; flex-direction: column; gap: 15px; justify-content: flex-start; min-width: 300px;">
                            
                            <!-- INTERCAMBIO DE NOMBRES: LECTURA VS EDICIÓN -->
                            <!-- Fila Visible solo en Modo Lectura -->
                            <div class="form-row super-text" id="rowNombreLectura" style="margin-bottom: 0;">
                                <div class="form-group full-width">
                                    <label>Nombre Completo</label>
                                    <input type="text" id="nombreCompleto" readonly>
                                </div>
                            </div>

                            <!-- Fila Visible solo en Modo Edición (4 Cajas) -->
                            <div class="form-row" id="rowNombreEdicion" style="margin-bottom: 0; display: none;">
                                <div class="form-group flex-1" style="min-width: 120px;">
                                    <label>Apellido</label>
                                    <input type="text" id="apellido">
                                </div>
                                <div class="form-group flex-1" style="min-width: 120px;">
                                    <label>Seg. Apellidos</label>
                                    <input type="text" id="segundoApellido">
                                </div>
                                <div class="form-group flex-1" style="min-width: 120px;">
                                    <label>Nombre Pila</label>
                                    <input type="text" id="nombrePila">
                                </div>
                                <div class="form-group flex-1" style="min-width: 120px;">
                                    <label>Seg. Nombres</label>
                                    <input type="text" id="segundoNombre">
                                </div>
                            </div>
                            
                            <!-- Fila: Apodo y Número de Socio -->
                            <div class="form-row medium-text" style="margin-bottom: 0;">
                                <div class="form-group flex-1" style="min-width: 120px;">
                                    <label>Apodo</label>
                                    <input type="text" id="apodo" name="apodo" readonly>
                                </div>
                                <div class="form-group flex-1" style="min-width: 150px;">
                                    <label>Número de Socio</label>
                                    <input type="text" id="numeroSocio" name="numeroSocio" readonly>
                                </div>
                            </div>

                            <!-- Fila: Fecha Nacimiento, Edad, DNI, CUIL, Trámite -->
                            <div class="form-row medium-text" style="margin-bottom: 0;">
                                <div class="form-group flex-1" style="min-width: 140px;">
                                    <label>Fecha Nacimiento</label>
                                    <input type="date" id="fechaNacimiento" name="fechaNacimiento" readonly>
                                </div>
                                <div class="form-group" style="flex: 0.5; min-width: 70px;">
                                    <label>Edad</label>
                                    <input type="number" id="edad" name="edad" readonly>
                                </div>
                                <div class="form-group flex-1" style="min-width: 130px;">
                                    <label>DNI</label>
                                    <input type="text" id="dni" name="dni" readonly>
                                </div>
                                <div class="form-group flex-1" style="min-width: 160px;">
                                    <label>CUIL</label>
                                    <input type="text" id="cuil" name="cuil" readonly>
                                </div>
                                <div class="form-group flex-1" style="min-width: 150px;">
                                    <label>N° Trámite</label>
                                    <input type="text" id="numeroTramite" name="numeroTramite" readonly>
                                </div>
                            </div>

                            <!-- Fila: Fecha Ingreso, Género, Nacionalidad, Domicilio -->
                            <div class="form-row medium-text" style="margin-bottom: 0;">
                                <div class="form-group flex-1" style="min-width: 130px;">
                                    <label>Fecha Ingreso</label>
                                    <input type="date" id="fechaIngreso" name="fechaIngreso" readonly>
                                </div>
                                <div class="form-group flex-1" style="min-width: 120px;">
                                    <label>Género</label>
                                    <select id="genero" name="genero" disabled style="padding: 0.6rem; border: 1px solid var(--border-color); border-radius: var(--radius-md); font-size: 1rem; width: 100%;">
                                        <option value=""></option>
                                        <option value="Masculino">Masculino</option>
                                        <option value="Femenino">Femenino</option>
                                    </select>
                                </div>
                                <div class="form-group flex-1" style="min-width: 150px;">
                                    <label>Nacionalidad</label>
                                    <input type="text" id="nacionalidad" name="nacionalidad" readonly>
                                </div>
                                <div class="form-group flex-2" style="min-width: 250px;">
                                    <label>Domicilio</label>
                                    <input type="text" id="domicilio" name="domicilio" readonly>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- ======================================================= -->
                <!-- BLOQUE DIVIDIDO: DATOS MÉDICOS (Izq) | OBRA SOCIAL (Der)-->
                <!-- ======================================================= -->
                <div style="display: flex; flex-wrap: wrap; gap: 20px; margin-bottom: 1.5rem;">
                    
                    <!-- SECCIÓN 2: DATOS MÉDICOS -->
                    <section class="profile-section" style="flex: 1; min-width: 300px; margin-bottom: 0;">
                        <h3><i class="fa-solid fa-user-doctor"></i> Datos Médicos</h3>
                        <div class="form-row" style="flex-wrap: nowrap; gap: 10px; margin-bottom: 15px; border-bottom: 1px dashed var(--border-color); padding-bottom: 15px;">
                            <div class="form-group" style="flex: 1; min-width: 80px;">
                                <label>Internación</label>
                                <input type="text" id="lugarInternacion" name="lugarInternacion" readonly>
                            </div>
                            <div class="form-group" style="flex: 1; min-width: 80px;">
                                <label>Alergias</label>
                                <input type="text" id="alergias" name="alergias" readonly>
                            </div>
                        </div>
                        <div id="medicosContainer" style="display: flex; flex-direction: column; gap: 10px;"></div>
                        <div style="display: flex; justify-content: flex-end; margin-top: 10px;">
                            <button type="button" id="btnAddMedico" class="btn btn-outline hidden"><i class="fa-solid fa-plus"></i> Añadir Médico</button>
                        </div>
                    </section>

                    <!-- SECCIÓN 3: OBRA SOCIAL -->
                    <section class="profile-section" style="flex: 1; min-width: 300px; margin-bottom: 0;">
                        <h3><i class="fa-solid fa-notes-medical"></i> Obra Social</h3>
                        <div id="obrasSocialesContainer" style="display: flex; flex-direction: column; gap: 10px;"></div>
                        <div style="display: flex; justify-content: flex-end; margin-top: 15px;">
                            <button type="button" id="btnAddOs" class="btn btn-outline hidden"><i class="fa-solid fa-plus"></i> Añadir Obra Social</button>
                        </div>
                    </section>

                </div>

                <!-- SECCIÓN 4: FAMILIARES RESPONSABLES -->
                <section class="profile-section">
                    <h3><i class="fa-solid fa-users"></i> Familiares Responsables</h3>
                    <div id="responsablesContainer"></div>
                    <div style="display: flex; justify-content: flex-end; margin-top: 10px;">
                        <button type="button" id="btnAddResponsable" class="btn btn-outline hidden"><i class="fa-solid fa-plus"></i> Añadir Responsable</button>
                    </div>
                </section>

                <!-- SECCIÓN 5: DRIVE -->
                <section class="profile-section section-5">
                    <h3><i class="fa-brands fa-google-drive" style="color: #0F9D58;"></i> Sistema de Archivos</h3>
                    <div class="form-row" style="margin-bottom: 0;">
                        <div class="form-group full-width">
                            <label>ID de la Carpeta del Residente</label>
                            <input type="text" id="carpetaDrive" name="carpetaDrive" readonly placeholder="Pegar ID o enlace de la carpeta aquí...">
                        </div>
                    </div>
                </section>
            </div> 
            
            <!-- ======================================================= -->
            <!-- PESTAÑA: DOCUMENTACIÓN (Contenedor Blanco)              -->
            <!-- ======================================================= -->
            <div id="tab-documentacion" class="hidden tab-content-wrapper" style="background: transparent; padding: 0; box-shadow: none;">
                
                <div style="display: flex; justify-content: flex-end; gap: 10px; margin-bottom: 20px; width: 100%;">
                    <button id="btnEditDocs" class="btn btn-primary"><i class="fa-solid fa-pen"></i> Editar Documentos</button>
                    <button id="btnCancelDocs" class="btn btn-danger hidden"><i class="fa-solid fa-xmark"></i> Cancelar</button>
                    <button id="btnSaveDocs" class="btn btn-success hidden"><i class="fa-solid fa-save"></i> Guardar Cambios</button>
                </div>
                
                <!-- CAJA BLANCA CONTENEDORA PARA DAR CONTRASTE -->
                <div style="background: var(--white); padding: 25px; border-radius: var(--radius-md); box-shadow: var(--shadow-sm);">
                    <div class="docs-layout">
                        
                        <!-- Barra Lateral Dinámica -->
                        <div class="docs-sidebar" id="docsSidebar"></div>
                        
                        <!-- Contenido y Visores -->
                        <div class="docs-content" id="docsContent">
                            <div id="docsEmptyMsg" class="docs-empty-state" style="display:none;">
                                <i class="fa-regular fa-folder-open"></i>
                                <h3>No hay documentos registrados</h3>
                                <p style="margin-top: 5px;">Presione "Editar Documentos" para añadir nuevos archivos.</p>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- Conexión al archivo Javascript -->
    <script src="js/resident.js"></script>
</body>
</html>
