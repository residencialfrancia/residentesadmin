<!-- [Descripción: Estructura principal del Dashboard. Contiene la barra de herramientas avanzada (vistas, ordenamiento, informes y botón de impresión), las grillas de Activos y Archivados, y la cabecera oculta exclusiva para la impresión en A4 (que incluye la fecha dinámica y el logoimpresion.png).] -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Residencial Francia - Archivo Digital</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- BARRA DE PESTAÑAS (TABS) -->
    <nav class="tabs-nav">
        <button class="tab-btn active" data-tab="tab-activos"><i class="fa-solid fa-users"></i> Residentes Activos</button>
        <button class="tab-btn" data-tab="tab-archivados"><i class="fa-solid fa-box-archive"></i> Archivados</button>
    </nav>

    <main class="dashboard-container">
        
        <!-- CABECERA EXCLUSIVA PARA IMPRESIÓN (Invisible en pantalla, solo visible al imprimir) -->
        <div id="printHeader" class="print-header">
            <div style="display: flex; flex-direction: column; gap: 5px;">
                <h2 id="printTitle">Informe de Residentes</h2>
                <span id="printDate" style="font-size: 12px; color: #333; font-weight: bold;"></span>
            </div>
            <!-- Logo exclusivo para impresión en blanco y negro -->
            <img src="img/logoimpresion.png" alt="Logo" class="print-logo" onerror="this.style.display='none'">
        </div>

        <!-- PESTAÑA 1: ACTIVOS -->
        <div id="tab-activos" class="tab-content active">
            
            <!-- CONTROLES BÁSICOS (Buscador y Nuevo Residente) -->
            <section class="controls-section">
                <div class="search-box">
                    <i class="fa-solid fa-search"></i>
                    <input type="text" id="searchActivos" placeholder="Buscar por nombre o DNI...">
                </div>
                <div class="filter-box">
                    <button class="btn btn-primary" onclick="window.location.href='resident.html'"><i class="fa-solid fa-plus"></i> Nuevo Residente</button>
                </div>
            </section>

            <!-- BARRA DE HERRAMIENTAS AVANZADA (Filtros, Orden, Reportes, Impresión) -->
            <section class="advanced-toolbar print-hide">
                
                <!-- 1. Vistas y Orden -->
                <div class="toolbar-group">
                    <button class="btn-icon active" id="btnViewGrid" title="Vista Mosaico"><i class="fa-solid fa-grip"></i></button>
                    <button class="btn-icon" id="btnViewList" title="Vista Lista"><i class="fa-solid fa-list"></i></button>
                    
                    <span style="color: var(--text-muted); margin-left: 10px; font-size: 0.9rem;">Ordenar:</span>
                    <select id="sortField">
                        <option value="nombre">Alfabético</option>
                        <option value="edad">Edad</option>
                        <option value="genero">Género</option>
                        <option value="numeroSocio">N° Socio</option>
                        <option value="fechaIngreso">Fecha de Ingreso</option>
                        <option value="obraSocial">Obra Social</option>
                        <option value="medicoCabecera">Médico de Cabecera</option>
                        <option value="nacionalidad">Nacionalidad</option>
                    </select>
                    
                    <select id="sortDirection">
                        <option value="asc">Ascendente (A-Z)</option>
                        <option value="desc">Descendente (Z-A)</option>
                    </select>
                </div>

                <!-- 2. Informes y Botón de Impresión -->
                <div class="toolbar-group">
                    <span style="color: var(--text-muted); font-size: 0.9rem;">Informe:</span>
                    <select id="reportPreset">
                        <option value="default">1. Residentes (Por defecto)</option>
                        <option value="cumple">2. Cumpleaños</option>
                        <option value="os">3. Obra Social</option>
                        <option value="fam">4. Familiares y Responsables</option>
                        <!-- Los reportes personalizados se inyectarán aquí por JS -->
                    </select>
                    <button class="btn btn-outline" style="padding: 0.4rem 0.8rem; font-size: 0.85rem;" onclick="openCustomReportModal()"><i class="fa-solid fa-plus"></i> Crear Filtro</button>
                    
                    <button class="btn btn-secondary" onclick="executePrint()" style="margin-left: 15px; background: #34495e;"><i class="fa-solid fa-print"></i> Imprimir</button>
                </div>
            </section>

            <!-- Spinner Loading -->
            <div id="loaderActivos" class="loader-container">
                <div class="spinner"></div><p>Cargando base de datos...</p>
            </div>

            <!-- VISTA MOSAICO (Tarjetas) -->
            <section class="grid-container" id="gridActivos"></section>

            <!-- VISTA LISTA (Tabla, también usada para imprimir) -->
            <section class="list-container hidden" id="listActivos">
                <table class="data-table">
                    <thead id="listActivosHead"></thead>
                    <tbody id="listActivosBody"></tbody>
                </table>
            </section>
        </div>

        <!-- PESTAÑA 2: ARCHIVADOS -->
        <div id="tab-archivados" class="tab-content hidden print-hide">
            <section class="controls-section">
                <div class="search-box">
                    <i class="fa-solid fa-search"></i>
                    <input type="text" id="searchArchivados" placeholder="Buscar en archivo histórico...">
                </div>
            </section>
            <div id="loaderArchivados" class="loader-container">
                <div class="spinner"></div><p>Cargando residentes archivados...</p>
            </div>
            <section class="grid-container" id="gridArchivados"></section>
        </div>
    </main>

    <!-- Modal para Crear Informe Personalizado -->
    <div id="reportModal" class="modal print-hide">
        <div class="modal-content" style="max-width: 600px;">
            <div class="modal-header">
                <h2>Crear Informe Personalizado</h2>
                <span class="close" onclick="closeCustomReportModal()">&times;</span>
            </div>
            <div class="modal-body">
                <div class="form-group" style="margin-bottom: 15px;">
                    <label>Título del Filtro / Informe</label>
                    <input type="text" id="customReportTitle" placeholder="Ej: Ficha Médica Completa...">
                </div>
                <p style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 10px;">Seleccione las columnas que desea incluir:</p>
                
                <div class="columns-picker" id="columnsPickerContainer">
                    <!-- JS inyectará los checkboxes aquí -->
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeCustomReportModal()">Cancelar</button>
                <button class="btn btn-primary" onclick="saveCustomReport()">Guardar y Aplicar</button>
            </div>
        </div>
    </div>

    <!-- Modal para Archivar Residente -->
    <div id="archiveModal" class="modal print-hide">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Archivar Residente</h2>
                <span class="close" id="closeModal">&times;</span>
            </div>
            <div class="modal-body">
                <p>Indique la fecha de salida para mover a <strong id="archiveName"></strong> al archivo inactivo.</p>
                <div class="form-group">
                    <label>Fecha de Salida</label>
                    <input type="date" id="archiveDate" class="modern-input">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="cancelArchive">Cancelar</button>
                <button class="btn btn-danger" id="confirmArchive">Archivar Residente</button>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
